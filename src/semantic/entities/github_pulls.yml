name: GitHub Pulls
type: fact_table
table: github_pulls
grain: one row per pull request
description: GitHub pull requests with status, author, and merge timing.
common_questions:
  - How many PRs were merged this week?
  - Who are the top PR contributors?
  - What is the average time to merge a PR?
  - How many open PRs are there?
  - What is the merge rate?
  - Show me PRs merged by specific author.

dimensions:
  - name: id
    sql: id
    type: number
    description: Unique identifier

  - name: number
    sql: number
    type: number
    description: PR number

  - name: title
    sql: title
    type: string
    description: Title of the PR

  - name: state
    sql: state
    type: string
    description: State of the PR (open, closed)

  - name: author
    sql: author
    type: string
    description: GitHub username of the author

  - name: repo
    sql: repo
    type: string
    description: Repository name (owner/repo)

time_dimensions:
  - name: created_at
    sql: created_at
    type: time
    description: Creation timestamp

  - name: closed_at
    sql: closed_at
    type: time
    description: Closing timestamp

  - name: merged_at
    sql: merged_at
    type: time
    description: Merge timestamp (null if not merged)

measures:
  - name: count
    sql: id
    type: count
    description: Total count of PRs

joins:
  - target_entity: GitHub Repos
    relationship: many_to_one
    join_columns:
      from: repo
      to: repo_full_name
